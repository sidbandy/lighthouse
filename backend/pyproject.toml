[project]
name = "lighthouse"
version = "0.1.0"
description = "A self-hosted command center for the software engineering internship and new-grad search"
requires-python = ">=3.11,<3.14"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    # Ingestion
    "httpx>=0.28",
    "rapidfuzz>=3.10",
    "python-dateutil>=2.9",
    # Scheduling
    "apscheduler>=3.10",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Local embedding model. Split out because torch is a large download and the
# ingestion pipeline is fully testable without it.
embeddings = [
    "sentence-transformers>=3.3",
]
# Resume parsing / ATS parse preview.
resume = [
    "pdfplumber>=0.11",
    "pypdf>=5.1",
]
# Tier 4 breadth connectors.
aggregators = [
    "python-jobspy>=1.1.80",
]
# The local voice pipeline for Practice. onnxruntime runs the Silero voice
# detector, which is a 2 MB model rather than a framework -- deliberately not
# the `silero-vad` pip package, which pulls torch and would break the RAM budget
# this whole project is shaped around.
#
# whisper.cpp is a binary, not a wheel, so it is not listed here:
#   brew install whisper-cpp
# Both are optional. Without them Practice measures what a transcript can show
# and says so; it never fails.
voice = [
    "onnxruntime>=1.20",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lighthouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated by alembic; not hand-maintained.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Fixtures are real markdown table rows; wrapping them would break the table.
"tests/test_markdown_repo.py" = ["E501"]
"tests/test_table_parser.py" = ["E501"]
# Depends()/Query() in argument defaults is the FastAPI dependency-injection
# idiom, not the mutable-default bug B008 exists to catch.
"lighthouse/**/router.py" = ["B008"]
